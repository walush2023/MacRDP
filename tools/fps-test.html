<!doctype html><html><body style="margin:0;background:#000;overflow:hidden"><canvas id=c></canvas><div id=t style="position:fixed;top:10px;left:10px;color:#0f0;font:40px monospace"></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight}r();onresize=r;
let n=0,last=performance.now(),f=0;function d(now){n++;f++;if(now-last>=1000){document.getElementById('t').textContent='local '+f+' fps';f=0;last=now}
const w=c.width,h=c.height;x.fillStyle='hsl('+(n*3%360)+',70%,20%)';x.fillRect(0,0,w,h);for(let i=0;i<40;i++){x.fillStyle='hsl('+((i*9+n*5)%360)+',90%,60%)';x.beginPath();x.arc(w/2+Math.cos(n/20+i)*w*0.4,h/2+Math.sin(n/15+i*1.3)*h*0.4,30+i,0,7);x.fill()}requestAnimationFrame(d)}requestAnimationFrame(d);
</script></body></html>
